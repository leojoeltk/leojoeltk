<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210" role="img" aria-labelledby="title desc">
  <title id="title">AI-generated voice detection demo</title>
  <desc id="desc">An abstract audio waveform around a sound detection indicator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  </defs>
  <rect width="640" height="210" rx="22" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="36" y="55" fill="#c4b5fd" font-size="14" font-weight="700" letter-spacing="3">AUDIO AI DEMO</text>
    <text x="34" y="101" fill="#f8fafc" font-size="30" font-weight="700">Voice Detection</text>
    <text x="36" y="132" fill="#cbd5e1" font-size="16">Human or AI-generated speech</text>
    <text x="36" y="163" fill="#94a3b8" font-size="12" letter-spacing="1.3">FASTAPI · STREAMLIT · MONGODB</text>
  </g>
  <circle cx="500" cy="105" r="60" fill="#0f172a" stroke="#818cf8" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="500" cy="105" r="44" fill="none" stroke="#a78bfa" stroke-opacity=".28" stroke-width="1.5"/>
  <path d="M425 106h24l10-25 16 51 14-39 12 26 13-17 13 4h40" fill="none" stroke="url(#wave)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="500" cy="105" r="5" fill="#f8fafc"/>
</svg>
